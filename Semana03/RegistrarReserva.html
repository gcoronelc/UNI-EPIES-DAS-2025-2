<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservar Computadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 30px;
            background-color: #f9f9f9;
        }
        .form-section {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4">Formulario de Reserva de Computadora</h2>
    <form id="reservaForm" class="form-section">
        
        <!-- Fecha de reserva -->
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha de reserva</label>
            <input type="date" id="fecha" name="fecha" class="form-control" required>
        </div>

        <!-- Hora de inicio -->
        <div class="mb-3">
            <label for="horaInicio" class="form-label">Hora de inicio</label>
            <input type="time" id="horaInicio" name="horaInicio" class="form-control" required min="08:00" max="20:00">
        </div>

        <!-- Cantidad de horas -->
        <div class="mb-3">
            <label for="horas" class="form-label">Cantidad de horas</label>
            <input type="number" id="horas" name="horas" class="form-control" required min="1" max="12">
        </div>

        <!-- Computadora a reservar -->
        <div class="mb-3">
            <label for="computadora" class="form-label">Computadora a reservar</label>
            <select id="computadora" name="computadora" class="form-select" required>
                <option value="">Seleccione una opción</option>
                <option value="PC01">PC01</option>
                <option value="PC02">PC02</option>
                <option value="PC03">PC03</option>
            </select>
        </div>

        <!-- Datos del cliente -->
        <div class="mb-3">
            <label for="cliente" class="form-label">Nombre del cliente</label>
            <input type="text" id="cliente" name="cliente" class="form-control" required>
        </div>

        <!-- Botón de registrar -->
        <button type="submit" class="btn btn-primary">Registrar Reserva</button>
    </form>

    <div id="resultado" class="mt-4"></div>
</div>

<script>
    const form = document.getElementById('reservaForm');
    const resultado = document.getElementById('resultado');

    // Configurar fechas válidas (hoy y mañana)
    window.onload = function () {
        const fechaInput = document.getElementById("fecha");
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        const yyyy = today.getFullYear();
        const mm = (today.getMonth() + 1).toString().padStart(2, "0");
        const dd = today.getDate().toString().padStart(2, "0");
        const todayStr = `${yyyy}-${mm}-${dd}`;

        const tdd = tomorrow.getDate().toString().padStart(2, "0");
        const tomorrowStr = `${yyyy}-${mm}-${tdd}`;

        fechaInput.min = todayStr;
        fechaInput.max = tomorrowStr;
        fechaInput.value = todayStr;
    };

    // Simular disponibilidad de computadoras
    function computadoraDisponible() {
        return Math.random() > 0.3; // 70% chance de estar disponible
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const computadora = document.getElementById("computadora").value;

        if (!computadoraDisponible()) {
            resultado.innerHTML = `
                <div class="alert alert-warning">
                    No hay computadoras disponibles en ese horario. Por favor, seleccione otra hora o fecha.
                </div>
            `;
            return;
        }

        resultado.innerHTML = `
            <div class="alert alert-success">
                ¡Reserva registrada exitosamente! Estado inicial: <strong>Activa</strong><br>
                Recuerde pagar al menos 2 horas antes del inicio del servicio.
            </div>
        `;

        form.reset();
    });
</script>

</body>
</html>
